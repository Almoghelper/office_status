<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1118">
<title>סטטוס משרד</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
</head><body>
<div class="app">
  <main class="main">
    <header class="top">
      <h1>סטטוס משרד</h1>
      <div class="pill"><span class="dot" id="dot"></span><span id="connTxt">מתחבר...</span></div>
    </header>

    <section class="card hide" id="login">
      <p class="lbl">התחברות לשרת (נשמר רק בדפדפן הזה)</p>
      <input type="text" id="u" placeholder="שם משתמש" autocapitalize="none" autocorrect="off" autocomplete="username">
      <input type="password" id="p" placeholder="סיסמה" autocomplete="current-password" style="margin-top:8px">
      <div class="row"><button class="btn" id="loginBtn" style="flex:1">התחבר</button></div>
    </section>

    <section class="card" id="cPrev">
      <div class="prev">
        <div id="pvSmall" class="pvs"><canvas id="cv" width="128" height="32"></canvas><div class="cap">מסך קטן</div></div>
        <div id="pvBig"><canvas id="cv2" width="240" height="240"></canvas><div class="cap">מסך גדול</div></div>
      </div>
      <div id="msg"></div>
    </section>

    <section class="card">
      <p class="lbl"><span>סטטוס</span><span class="lk" id="editB">עריכה</span></p>
      <input type="text" id="note" maxlength="30" placeholder="הערה (לא חובה), למשל: חוזר ב-14:00" style="margin-bottom:10px">
      <div class="grid" id="grid"></div>
      <div class="row">
        <input type="text" id="custom" maxlength="60" placeholder="סטטוס חופשי, עברית או אנגלית">
        <input type="color" id="col" value="#1565c0" class="clr" aria-label="צבע">
        <button class="btn" id="sendCustom">שלח</button>
      </div>
    </section>

    <section class="card hide" id="cNew">
      <p class="lbl"><span id="nTitle">כפתור חדש</span><span class="lk" id="cancelNew">ביטול</span></p>
      <input type="text" id="nName" placeholder="שם הכפתור" maxlength="20">
      <div class="row">
        <input type="color" id="nCol" value="#8e24aa" class="clr" aria-label="צבע">
        <div class="seg" id="nTxt"><button class="a" data-v="w" type="button">טקסט לבן</button><button data-v="b" type="button">טקסט שחור</button></div>
      </div>
      <div class="row"><label class="chk"><input type="checkbox" id="nInv">מסך קטן הפוך (רקע לבן)</label></div>
      <div class="row" id="nSvRow"><span class="small">זווית סרוו</span><input type="number" id="nSv" min="0" max="180" placeholder="0-180 (לא חובה)"></div>
      <div class="row"><button class="btn" id="saveNew" style="flex:1">שמור כפתור</button></div>
      <p class="hint">הכפתורים נשמרים בשרת ומופיעים בכל מכשיר.</p>
    </section>

    <section class="card" id="cServo">
      <div class="sv"><p class="lbl" style="margin:0">סרוו</p><span class="small"><span id="svv">90</span>°</span></div>
      <input type="range" id="sv" min="0" max="180" value="90">
      <div class="row">
        <button class="btn2" data-a="0">0°</button><button class="btn2" data-a="90">90°</button><button class="btn2" data-a="180">180°</button><button class="btn2" id="svOff">שחרר</button>
      </div>
    </section>
  </main>

  <nav class="rail" id="rail" aria-label="הגדרות">
    <button class="ri" id="tgl" aria-label="הרחב או כווץ"><i class="ti ti-layout-sidebar-right-expand" aria-hidden="true"></i><span>הגדרות</span></button>
    <button class="ri on" data-k="small" aria-pressed="true"><i class="ti ti-device-desktop" aria-hidden="true"></i><span>מסך קטן</span><span class="st2">פעיל</span></button>
    <button class="ri on" data-k="big" aria-pressed="true"><i class="ti ti-device-tv" aria-hidden="true"></i><span>מסך גדול</span><span class="st2">פעיל</span></button>
    <button class="ri on" data-k="servo" aria-pressed="true"><i class="ti ti-rotate-clockwise" aria-hidden="true"></i><span>סרוו</span><span class="st2">פעיל</span></button>
    <button class="ri" id="blI"><i class="ti ti-sun" aria-hidden="true"></i><span>בהירות</span></button>
    <div class="bl" id="blBox"><input type="range" id="bl" min="5" max="255" value="160"></div>
    <div class="info" id="info"></div>
    <a class="ri xtra" id="wifiL" href="http://status.local/wifi" target="_blank" rel="noopener"><i class="ti ti-wifi" aria-hidden="true"></i><span>הגדרות WiFi</span></a>
    <button class="ri xtra" id="resetP"><i class="ti ti-restore" aria-hidden="true"></i><span>שחזר כפתורים</span></button>
    <button class="ri last" id="logoutB"><i class="ti ti-logout" aria-hidden="true"></i><span>החלף משתמש</span></button>
  </nav>
</div>
<script src="mqtt.min.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', function () {
  var miss = [];
  if (typeof mqtt === 'undefined') miss.push('mqtt.min.js');
  if (typeof drawGrid === 'undefined') miss.push('app.js');
  if (miss.length) {
    document.getElementById('connTxt').textContent = 'לא נטען: ' + miss.join(', ');
    document.getElementById('dot').style.background = '#e74c3c';
  }
});
</script>
</body></html>
